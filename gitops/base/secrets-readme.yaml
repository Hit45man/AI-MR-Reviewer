# POC secrets — create manually after terraform apply (do not commit real values).
#
# kubectl -n platform create secret generic litellm-secrets \
#   --from-literal=LITELLM_MASTER_KEY='sk-...' \
#   --from-literal=DATABASE_URL='postgresql://...'
#
# kubectl -n platform create secret generic mr-reviewer-secrets \
#   --from-literal=LITELLM_API_KEY='sk-...' \
#   --from-literal=GITHUB_TOKEN='ghp_...' \
#   --from-literal=GITHUB_WEBHOOK_SECRET='...' \
#   --from-literal=DATABASE_URL='postgresql://...'
#
# DATABASE_URL is also in Secrets Manager: mr-reviewer-dev-database-url (json key "url").
# LITELLM_MASTER_KEY is in Secrets Manager: mr-reviewer-dev-litellm-master-key.
apiVersion: v1
kind: ConfigMap
metadata:
  name: secrets-readme
  namespace: platform
data:
  README: |
    Create litellm-secrets and mr-reviewer-secrets before pods become Ready.
    See comments at the top of this file in git.
