# MR Reviewer — GitHub webhooks + Bedrock via LiteLLM (deployed by Argo CD)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mr-reviewer
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mr-reviewer
  template:
    metadata:
      labels:
        app: mr-reviewer
    spec:
      serviceAccountName: mr-reviewer
      containers:
        - name: mr-reviewer
          # CI bumps this tag (see .github/workflows/mr-reviewer-ci.yml)
          image: 225595536111.dkr.ecr.ap-south-1.amazonaws.com/mr-reviewer:7cbb8ac
          ports:
            - containerPort: 8080
          env:
            - name: LITELLM_URL
              value: http://litellm.platform.svc.cluster.local:4000
            - name: PRIMARY_MODEL
              value: nova-pro
            - name: FALLBACK_MODEL
              value: nova-lite
            - name: EMBEDDING_MODEL
              value: titan-embed-v2
            - name: GITHUB_API_URL
              value: https://api.github.com
            - name: WATCHED_REPOS
              value: Hit45man/AI-MR-Reviewer
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mr-reviewer-secrets
                  key: LITELLM_API_KEY
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mr-reviewer-secrets
                  key: GITHUB_TOKEN
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: mr-reviewer-secrets
                  key: GITHUB_WEBHOOK_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mr-reviewer-secrets
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: mr-reviewer
  namespace: platform
spec:
  selector:
    app: mr-reviewer
  ports:
    - port: 80
      targetPort: 8080
---
# Point GitHub webhook to https://<ADDRESS>/webhook (ALB from AWS Load Balancer Controller)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mr-reviewer
  namespace: platform
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mr-reviewer
                port:
                  number: 80
