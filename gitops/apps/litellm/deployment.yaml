# LiteLLM — Bedrock via IRSA (SA created by Terraform with role annotation)
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: platform
data:
  proxy_config.yaml: |
    # synced from ../../litellm/proxy_config.yaml — keep in sync
    model_list:
      - model_name: nova-pro
        litellm_params:
          model: bedrock/amazon.nova-pro-v1:0
          aws_region_name: os.environ/AWS_REGION
      - model_name: nova-lite
        litellm_params:
          model: bedrock/amazon.nova-lite-v1:0
          aws_region_name: os.environ/AWS_REGION
      - model_name: titan-embed-v2
        litellm_params:
          model: bedrock/amazon.titan-embed-text-v2:0
          aws_region_name: os.environ/AWS_REGION
    litellm_settings:
      drop_params: true
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      serviceAccountName: litellm
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          args: ["--config", "/config/proxy_config.yaml", "--port", "4000"]
          ports:
            - containerPort: 4000
          env:
            - name: AWS_REGION
              value: ap-south-1
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_MASTER_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: DATABASE_URL
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: platform
spec:
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: 4000
